<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e86a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vores To-do">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Vores To-do</title>
<style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#2b2622;--mute:#8a8178;--line:#ece4da;--accent:#e86a4a;--a:#4a7be8;--b:#e84a8f;--both:#7a5ae8;--bad:#d93a3a;--ok:#3aa76d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;z-index:5;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px}
.icon-btn{background:none;border:0;font-size:22px;padding:6px;cursor:pointer}
.sync{font-size:12px;color:var(--mute);margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.msel{margin-top:10px;padding:8px 12px;border-radius:12px;font-size:14px;width:auto;max-width:100%}
main{padding:14px 18px;max-width:640px;margin:auto}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.body{flex:1;min-width:0;cursor:pointer}
.t{word-wrap:break-word}
.meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.pill{color:#fff;border-radius:10px;padding:1px 9px;font-size:12px}
.pill.a{background:var(--a)}.pill.b{background:var(--b)}.pill.both{background:var(--both)}
.due.over{color:var(--bad);font-weight:600}.due.today{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:32px;box-shadow:0 6px 18px rgba(232,106,74,.45);cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(251,247,242,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.bar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:inherit;font-size:12px;color:var(--mute);cursor:pointer}
.bar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar button.on{color:var(--accent);font-weight:600}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.addrow input{flex:1}
.addrow button{flex:none;width:52px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:26px;cursor:pointer}
.shopi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.shopi .chk{margin-top:0}
.shopi .t{flex:1;min-width:0}
.shopi.done .chk{background:var(--ok);border-color:var(--ok)}
.shopi.done .t{text-decoration:line-through;color:var(--mute)}
.shopi .x{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.shopbtns{display:flex;gap:8px;margin:2px 0 12px}
.shopbtns button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.shopbtns button:disabled{opacity:.4;cursor:default}
.shopbtns button.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.calform{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.calform .r{display:flex;gap:8px}
.calform .r input{flex:1;min-width:0}
.calform button{flex:none;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.cali{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.cali .d{flex:none;width:52px;text-align:center;line-height:1.1;color:var(--accent)}
.cali .d b{display:block;font-size:22px}.cali .d span{font-size:12px;text-transform:uppercase}
.cali .t{flex:1;min-width:0;word-wrap:break-word}
.cali .t small{display:block;color:var(--mute);font-size:13px}
.cali .del{flex:none;border:1px solid var(--line);background:#fff;color:var(--bad);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.av{display:flex;flex:none;align-self:center;margin-left:4px}
.av b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;border:2px solid var(--card)}
.av b.a{background:var(--a)}.av b.b{background:var(--b)}
.av b+b{margin-left:-9px}
.ctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.fbtn{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);flex:none}
.fbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.fbtn i{font-style:normal;background:var(--accent);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:12px;display:grid;place-items:center;padding:0 5px}
.fbtn i[hidden]{display:none}
.fsum{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--bg);z-index:21;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.dh h2{margin:0;font-size:20px}
.db{flex:1;overflow-y:auto;padding:0 18px 12px}
.db .sec{margin-top:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.df{display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.df .btn{margin:0}
.secrow{display:flex;align-items:center;justify-content:space-between}
.secrow button{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;margin-top:10px}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button.on{color:#fff;border-color:transparent}
.seg button.on[data-v=a]{background:var(--a)}.seg button.on[data-v=b]{background:var(--b)}.seg button.on[data-v=both]{background:var(--both)}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.del{color:var(--bad);flex:0 0 auto;padding:12px 16px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
details{margin-top:16px;font-size:14px}summary{cursor:pointer;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="title">Vores To-do</h1><button class="icon-btn" id="openSet" aria-label="Indstillinger">⚙️</button></div>
  <div class="sync" id="sync">Kun på denne telefon</div>
  <div id="todoControls" class="ctl">
    <button id="openFilter" class="fbtn" aria-label="Filtrer og sortér"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Filtrer</span><i id="fBadge" hidden></i></button>
    <div id="fSummary" class="fsum"></div>
  </div>
</header>
<main id="list"></main>
<main id="shop" hidden>
  <form class="addrow" id="shopForm" autocomplete="off">
    <input id="shopInput" placeholder="Tilføj vare, fx mælk, æg, brød" enterkeyhint="done">
    <button aria-label="Tilføj">+</button>
  </form>
  <div class="shopbtns">
    <button id="shopCopy" type="button">Kopier liste</button>
    <button id="shopClear" type="button">Tøm listen</button>
  </div>
  <div id="shopList"></div>
</main>
<main id="cal" hidden>
  <form class="calform" id="calForm" autocomplete="off">
    <input id="calTitle" placeholder="Titel, fx Tandlæge kl. 14" required>
    <div class="r"><input type="date" id="calDate" required><button>Tilføj</button></div>
  </form>
  <div id="calList"></div>
</main>
<button class="fab" id="add" aria-label="Ny opgave">+</button>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Filtrer og sortér">
  <div class="dh"><h2>Filtrer og sortér</h2><button class="icon-btn" id="closeFilter" aria-label="Luk">✕</button></div>
  <div class="db" id="drawerBody"></div>
  <div class="df"><button class="btn" id="fReset">Nulstil</button><button class="btn pri" id="fDone">Vis opgaver</button></div>
</aside>
<nav class="bar">
  <button id="navTodo" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>To-do</button>
  <button id="navShop"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Indkøb</button>
  <button id="navCal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kalender</button>
</nav>

<dialog id="dTask">
  <form method="dialog" id="fTask">
    <h2 style="margin:0" id="dTitle">Ny opgave</h2>
    <label>Hvad skal gøres?</label>
    <input id="fTitle" required placeholder="fx Book tid hos tandlægen" autocomplete="off">
    <label>Hvem?</label>
    <div class="seg" id="fWho"></div>
    <label>Deadline</label>
    <input type="date" id="fDue">
    <div class="row">
      <button type="button" class="btn del" id="fDel" hidden>Slet</button>
      <button type="button" class="btn" id="fCancel">Annuller</button>
      <button class="btn pri">Gem</button>
    </div>
  </form>
</dialog>

<dialog id="dSet">
  <h2 style="margin:0">Indstillinger</h2>
  <label>Dit navn</label><input id="sMe">
  <label>Din kærestes navn</label><input id="sPartner">
  <label>Hvem er du på denne telefon?</label>
  <select id="sWho"></select>

  <div class="sw"><strong>Notifikationer</strong><input type="checkbox" id="sNotif" style="width:auto;transform:scale(1.3)"></div>
  <label>Påmind mig</label>
  <select id="sLead">
    <option value="0">Samme dag som deadline</option>
    <option value="1">1 dag før</option>
    <option value="2">2 dage før</option>
    <option value="3">3 dage før</option>
  </select>
  <label>Klokken</label><input type="time" id="sTime">
  <div class="hint">Notifikationer vises, når appen er åbnet (eller kører i baggrunden). Se noter om push nederst i README.</div>

  <div class="row"><button class="btn" id="sClose">Luk</button><button class="btn pri" id="sSave">Gem</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const LS = (k, v) => v === undefined ? JSON.parse(localStorage.getItem(k) || 'null') : localStorage.setItem(k, JSON.stringify(v));
// Fast forbindelse til jeres fælles database (Supabase publishable key må gerne ligge i koden)
const CLOUD = {url:'https://gqkqhukorzohuyazwnfa.supabase.co', key:'sb_publishable_mVHrpNyqdmhEecmmVgjSdw_z4n6mQX6', room:'vt-685daf3c6c3350d07e69'};
let settings = Object.assign({me:'Jesper', partner:'Cecilie', who:'a', notif:false, lead:1, time:'09:00'}, LS('settings') || {}, CLOUD);
// Ældre gemte standardnavne opdateres automatisk
if(settings.me === 'Mig') settings.me = 'Jesper';
if(settings.partner === 'Kæreste') settings.partner = 'Cecilie';
LS('settings', settings);
let todos = LS('todos') || [];
let filter = 'all', monthF = 'all', sortBy = 'due', editing = null, formWho = 'a';
// Indkøbsvarer gemmes som almindelige rækker med who === 'shop' (så synkroniseringen virker uændret)
let view = LS('view') || 'todo';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now() + Math.random().toString(16).slice(2);
const names = () => ({a: settings.me, b: settings.partner, both: 'Begge'});
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => iso(new Date());

function save(){ LS('todos', todos); render(); push(); }
function touch(t){ t.updated = new Date().toISOString(); }

/* ---------- Visning ---------- */
function dueLabel(due){
  if(!due) return '';
  const diff = Math.round((new Date(due) - new Date(today())) / 864e5);
  const d = new Date(due).toLocaleDateString('da-DK', {day:'numeric', month:'short'});
  if(diff < 0) return {cls:'over', txt: `Overskredet · ${d}`};
  if(diff === 0) return {cls:'today', txt:'I dag'};
  if(diff === 1) return {cls:'', txt:'I morgen'};
  return {cls:'', txt: d};
}
const monthLabel = m => { const s = new Date(m + '-01T12:00:00').toLocaleDateString('da-DK', {month:'long', year:'numeric'}); return s.charAt(0).toUpperCase() + s.slice(1); };
const ini = s => esc((s || '?').trim().charAt(0).toUpperCase());
const SORTS = {due:'Deadline', changed:'Senest ændret', az:'A–Å'};
function render(){
  renderShop(); renderCal();
  const n = names();
  let list = todos.filter(t => !t.deleted && t.who !== 'shop' && t.who !== 'cal');
  if(filter === 'done') list = list.filter(t => t.done);
  else { list = list.filter(t => !t.done); if(filter !== 'all') list = list.filter(t => t.who === filter || t.who === 'both'); }
  // Måneder der findes i den aktuelle visning
  const months = [...new Set(list.filter(t => t.due).map(t => t.due.slice(0,7)))].sort();
  const hasNone = list.some(t => !t.due);
  if(monthF !== 'all' && monthF !== 'none' && !months.includes(monthF)) monthF = 'all';
  if(monthF === 'none' && !hasNone) monthF = 'all';
  if(monthF === 'none') list = list.filter(t => !t.due);
  else if(monthF !== 'all') list = list.filter(t => t.due && t.due.startsWith(monthF));
  if(sortBy === 'az') list.sort((x,y) => x.title.localeCompare(y.title, 'da'));
  else if(sortBy === 'changed') list.sort((x,y) => (y.updated || '').localeCompare(x.updated || ''));
  else list.sort((x,y) => (x.due || '9999').localeCompare(y.due || '9999'));

  renderFilterUI(n, months, hasNone);

  const box = $('#list');
  if(!list.length){ box.innerHTML = `<div class="empty">${filter==='done'?'Ingen færdige endnu':(filter!=='all'||monthF!=='all')?'Ingen opgaver med de valgte filtre':'Ingenting at lave 🎉<br>Tryk + for at tømme hovedet'}</div>`; return; }
  const groups = (filter === 'done' || sortBy !== 'due') ? [[filter === 'done' ? 'Færdige' : SORTS[sortBy], list]] : [
    ['Overskredet', list.filter(t => t.due && t.due < today())],
    ['I dag', list.filter(t => t.due === today())],
    ['Senere', list.filter(t => t.due > today())],
    ['Uden deadline', list.filter(t => !t.due)]
  ];
  box.innerHTML = groups.filter(g => g[1].length).map(([h, items]) =>
    `<div class="sec">${h}</div>` + items.map(t => {
      const dl = dueLabel(t.due);
      return `<div class="item ${t.done?'done':''}" data-id="${t.id}">
        <div class="chk" data-chk>${t.done?'✓':''}</div>
        <div class="body" data-edit><div class="t">${esc(t.title)}</div>
        ${dl?`<div class="meta"><span class="due ${dl.cls}">${dl.txt}</span></div>`:''}</div>
        <div class="av" title="${esc(n[t.who])}">${t.who === 'both' ? `<b class="a">${ini(n.a)}</b><b class="b">${ini(n.b)}</b>` : `<b class="${t.who}">${ini(n[t.who])}</b>`}</div></div>`;
    }).join('')).join('');
}

/* ---------- Filter-sidebar ---------- */
function renderFilterUI(n, months, hasNone){
  const opt = (grp, val, txt, cur) => `<button class="opt ${cur === val ? 'on' : ''}" data-grp="${grp}" data-val="${val}">${esc(txt)}</button>`;
  $('#drawerBody').innerHTML =
    `<div class="sec">Vis</div><div class="opts">` +
      [['all','Alle'],['a',n.a],['b',n.b],['done','Færdige']].map(([v,l]) => opt('who', v, l, filter)).join('') + `</div>` +
    `<div class="sec">Måned</div><div class="opts">` +
      opt('month','all','Alle måneder',monthF) + months.map(m => opt('month', m, monthLabel(m), monthF)).join('') + (hasNone ? opt('month','none','Uden deadline',monthF) : '') + `</div>` +
    `<div class="sec">Sortér efter</div><div class="opts">` +
      Object.entries(SORTS).map(([v,l]) => opt('sort', v, l, sortBy)).join('') + `</div>`;
  const parts = [];
  if(filter !== 'all') parts.push({a:n.a, b:n.b, done:'Færdige'}[filter]);
  if(monthF === 'none') parts.push('Uden deadline'); else if(monthF !== 'all') parts.push(monthLabel(monthF));
  if(sortBy !== 'due') parts.push('Sorteret: ' + SORTS[sortBy]);
  $('#fSummary').textContent = parts.join(' · ');
  const b = $('#fBadge'); b.textContent = parts.length; b.hidden = !parts.length;
}
const openDrawer = () => { $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); };
const closeDrawer = () => { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); };
$('#openFilter').onclick = openDrawer;
$('#closeFilter').onclick = $('#fDone').onclick = $('#scrim').onclick = closeDrawer;
$('#fReset').onclick = () => { filter = 'all'; monthF = 'all'; sortBy = 'due'; render(); };
$('#drawerBody').onclick = e => {
  const b = e.target.closest('.opt'); if(!b) return;
  const {grp, val} = b.dataset;
  if(grp === 'who'){ filter = val; monthF = 'all'; } else if(grp === 'month') monthF = val; else sortBy = val;
  render();
};

/* ---------- Opgave-dialog ---------- */
function setWho(v){ formWho = v; document.querySelectorAll('#fWho button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function openTask(t){
  editing = t || null;
  const n = names();
  $('#fWho').innerHTML = ['a','b','both'].map(k => `<button type="button" data-v="${k}">${esc(n[k])}</button>`).join('');
  $('#dTitle').textContent = t ? 'Rediger opgave' : 'Ny opgave';
  $('#fTitle').value = t ? t.title : '';
  $('#fDue').value = t ? (t.due || '') : '';
  $('#fDel').hidden = !t;
  setWho(t ? t.who : settings.who);
  $('#dTask').showModal();
  if(!t) setTimeout(() => $('#fTitle').focus(), 50);
}
$('#fWho').onclick = e => { const b = e.target.closest('button'); if(b) setWho(b.dataset.v); };
$('#fCancel').onclick = () => $('#dTask').close();
$('#fDel').onclick = () => { if(editing){ editing.deleted = true; touch(editing); save(); } $('#dTask').close(); };
$('#fTask').onsubmit = () => {
  const title = $('#fTitle').value.trim(); if(!title) return;
  if(editing){ Object.assign(editing, {title, who: formWho, due: $('#fDue').value || null}); touch(editing); }
  else { const t = {id: uid(), title, who: formWho, due: $('#fDue').value || null, done: false, deleted: false}; touch(t); todos.push(t); }
  save();
};
$('#add').onclick = () => openTask();
$('#list').onclick = e => {
  const el = e.target.closest('.item'); if(!el) return;
  const t = todos.find(x => x.id === el.dataset.id);
  if(e.target.closest('[data-chk]')){ t.done = !t.done; touch(t); save(); }
  else if(e.target.closest('[data-edit]')) openTask(t);
};

/* ---------- Indstillinger ---------- */
$('#openSet').onclick = () => {
  const n = names();
  $('#sMe').value = settings.me; $('#sPartner').value = settings.partner;
  $('#sWho').innerHTML = `<option value="a">${esc(n.a)}</option><option value="b">${esc(n.b)}</option>`;
  $('#sWho').value = settings.who;
  $('#sNotif').checked = settings.notif; $('#sLead').value = settings.lead; $('#sTime').value = settings.time;
  $('#dSet').showModal();
};
$('#sMe').oninput = $('#sPartner').oninput = () => {
  const a = $('#sMe').value || 'Jesper', b = $('#sPartner').value || 'Cecilie';
  $('#sWho').options[0].text = a; $('#sWho').options[1].text = b;
};
$('#sClose').onclick = () => $('#dSet').close();
$('#sSave').onclick = async () => {
  const wantsNotif = $('#sNotif').checked;
  Object.assign(settings, {
    me: $('#sMe').value.trim() || 'Jesper', partner: $('#sPartner').value.trim() || 'Cecilie', who: $('#sWho').value,
    notif: wantsNotif, lead: +$('#sLead').value, time: $('#sTime').value || '09:00',
    ...CLOUD
  });
  LS('settings', settings);
  if(wantsNotif && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
  if(wantsNotif && (!('Notification' in window) || Notification.permission !== 'granted'))
    alert('Notifikationer er ikke slået til. På iPhone: læg først appen på hjemmeskærmen (Del → Føj til hjemmeskærm), åbn den derfra og slå dem til igen.');
  $('#dSet').close(); render(); pull(); checkReminders();
};

/* ---------- Synkronisering (Supabase REST) ---------- */
const cloud = () => settings.url && settings.key && settings.room;
const H = () => {
  const h = {apikey: settings.key, 'Content-Type': 'application/json'};
  // Gamle nøgler (eyJ…) er JWT'er og sendes også som Bearer. Nye sb_publishable_-nøgler sendes kun som apikey.
  if(!settings.key.startsWith('sb_')) h.Authorization = 'Bearer ' + settings.key;
  return h;
};
function setSync(msg){ $('#sync').textContent = msg; }
async function pull(){
  if(!cloud()){ setSync('Kun på denne telefon'); return; }
  try{
    const r = await fetch(`${settings.url}/rest/v1/todos?room=eq.${encodeURIComponent(settings.room)}&select=*`, {headers: H()});
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    let changed = false;
    for(const row of rows){
      const loc = todos.find(t => t.id === row.id);
      const remote = {id: row.id, title: row.title, who: row.who, due: row.due, done: row.done, deleted: row.deleted, updated: row.updated};
      if(!loc){ todos.push(remote); changed = true; }
      else if(row.updated > loc.updated){ Object.assign(loc, remote); changed = true; }
    }
    if(changed){ LS('todos', todos); render(); }
    await push(true);
    setSync('Synkroniseret · ' + new Date().toLocaleTimeString('da-DK', {hour:'2-digit', minute:'2-digit'}));
  }catch(e){ setSync('Offline – prøver igen snart'); }
}
async function push(silent){
  if(!cloud()) return;
  try{
    const rows = todos.map(t => ({id: t.id, room: settings.room, title: t.title, who: t.who, due: t.due, done: t.done, deleted: !!t.deleted, updated: t.updated}));
    if(!rows.length) return;
    const r = await fetch(`${settings.url}/rest/v1/todos?on_conflict=id`, {method:'POST', headers: {...H(), Prefer:'resolution=merge-duplicates,return=minimal'}, body: JSON.stringify(rows)});
    if(!r.ok) throw new Error(r.status);
    if(!silent) setSync('Synkroniseret · ' + new Date().toLocaleTimeString('da-DK', {hour:'2-digit', minute:'2-digit'}));
  }catch(e){ if(!silent) setSync('Offline – prøver igen snart'); }
}

/* ---------- Påmindelser ---------- */
async function checkReminders(){
  if(!settings.notif || !('Notification' in window) || Notification.permission !== 'granted') return;
  const sent = LS('sent') || {};
  const now = new Date(), [hh, mm] = settings.time.split(':').map(Number);
  const mine = todos.filter(t => !t.deleted && !t.done && t.due && (t.who === settings.who || t.who === 'both'));
  const reg = await (navigator.serviceWorker && navigator.serviceWorker.ready.catch(() => null));
  for(const t of mine){
    const when = new Date(t.due + 'T00:00:00'); when.setDate(when.getDate() - settings.lead); when.setHours(hh, mm, 0, 0);
    const overdue = t.due < today();
    const key = t.id + '|' + t.due + '|' + (overdue ? today() : 'p');
    if(now >= when && !sent[key]){
      const dl = dueLabel(t.due).txt;
      const opts = {body: `${t.title}\n${dl}`, icon: 'icon-192.png', tag: t.id};
      const title = overdue ? 'Overskredet opgave' : 'Opgave nærmer sig';
      if(reg) reg.showNotification(title, opts); else new Notification(title, opts);
      sent[key] = 1;
    }
  }
  LS('sent', sent);
}


/* ---------- Indkøbsliste ---------- */
const shopItems = () => todos.filter(t => t.who === 'shop' && !t.deleted);
function renderShop(){
  const items = shopItems(), open = items.filter(t => !t.done), done = items.filter(t => t.done);
  const row = t => `<div class="shopi ${t.done?'done':''}" data-id="${t.id}"><div class="chk" data-chk>${t.done?'✓':''}</div><div class="t">${esc(t.title)}</div><button class="x" data-del aria-label="Fjern">×</button></div>`;
  let html = '';
  if(!items.length) html = '<div class="empty">Indkøbslisten er tom 🛒<br>Skriv en vare ovenfor</div>';
  else {
    html += open.map(row).join('') || '<div class="empty" style="padding:20px 0">Alt er i kurven 🎉</div>';
    if(done.length) html += `<div class="secrow"><div class="sec">I kurven (${done.length})</div><button data-clear>Ryd</button></div>` + done.map(row).join('');
  }
  $('#shopList').innerHTML = html;
  $('#shopCopy').disabled = !items.length; $('#shopClear').disabled = !items.length;
}
function flash(btn, txt, ms = 1800){
  const old = btn.dataset.label || btn.textContent; btn.dataset.label = old;
  btn.textContent = txt; clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove('warn'); btn.dataset.armed = ''; }, ms);
}
$('#shopCopy').onclick = async e => {
  const btn = e.currentTarget;
  // Kun det, der stadig mangler (ikke afkrydsede varer)
  const text = shopItems().filter(t => !t.done).map(t => t.title).join('\n');
  if(!text){ flash(btn, 'Intet at kopiere'); return; }
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(_){}
  if(!ok){
    try{
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    }catch(_){}
  }
  flash(btn, ok ? 'Kopieret ✓' : 'Kunne ikke kopiere');
};
$('#shopClear').onclick = e => {
  const btn = e.currentTarget;
  if(btn.dataset.armed !== '1'){ btn.dataset.armed = '1'; btn.classList.add('warn'); flash(btn, 'Tryk igen for at tømme', 3000); return; }
  clearTimeout(btn._t); btn.dataset.armed = ''; btn.classList.remove('warn'); btn.textContent = 'Tøm listen';
  shopItems().forEach(t => { t.deleted = true; touch(t); }); save();
};
$('#shopForm').onsubmit = e => {
  e.preventDefault();
  const inp = $('#shopInput');
  inp.value.split(/[,\n]/).map(s => s.trim()).filter(Boolean).forEach(title => {
    const t = {id: uid(), title, who: 'shop', due: null, done: false, deleted: false}; touch(t); todos.push(t);
  });
  inp.value = ''; save(); inp.focus();
};
$('#shopList').onclick = e => {
  if(e.target.closest('[data-clear]')){ shopItems().filter(t => t.done).forEach(t => { t.deleted = true; touch(t); }); save(); return; }
  const el = e.target.closest('.shopi'); if(!el) return;
  const t = todos.find(x => x.id === el.dataset.id); if(!t) return;
  if(e.target.closest('[data-del]')) t.deleted = true;
  else t.done = !t.done;
  touch(t); save();
};


/* ---------- Kalenderaftaler (gemmes som rækker med who === 'cal', dato i due) ---------- */
const calItems = () => todos.filter(t => t.who === 'cal' && !t.deleted).sort((a,b) => (a.due||'').localeCompare(b.due||'') || a.title.localeCompare(b.title));
function renderCal(){
  const items = calItems();
  $('#calList').innerHTML = items.length ? items.map(t => {
    const d = new Date(t.due + 'T12:00:00');
    const day = d.getDate(), mon = d.toLocaleDateString('da-DK', {month:'short'}).replace('.', '');
    const wd = d.toLocaleDateString('da-DK', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    return `<div class="cali" data-id="${t.id}"><div class="d"><b>${day}</b><span>${esc(mon)}</span></div><div class="t">${esc(t.title)}<small>${esc(wd)}</small></div><button class="del" data-del>Slet</button></div>`;
  }).join('') : '<div class="empty">Ingen aftaler at lægge i kalenderen 📅<br>Skriv en ovenfor</div>';
}
$('#calForm').onsubmit = e => {
  e.preventDefault();
  const title = $('#calTitle').value.trim(), due = $('#calDate').value;
  if(!title || !due) return;
  const t = {id: uid(), title, who: 'cal', due, done: false, deleted: false}; touch(t); todos.push(t);
  $('#calTitle').value = ''; $('#calDate').value = ''; save(); $('#calTitle').focus();
};
$('#calList').onclick = e => {
  if(!e.target.closest('[data-del]')) return;
  const t = todos.find(x => x.id === e.target.closest('.cali').dataset.id); if(!t) return;
  t.deleted = true; touch(t); save();
};

/* ---------- Navigation ---------- */
function setView(v){
  if(!['todo','shop','cal'].includes(v)) v = 'todo';
  view = v; LS('view', v);
  $('#list').hidden = v !== 'todo'; $('#todoControls').hidden = v !== 'todo'; $('#add').hidden = v !== 'todo';
  $('#shop').hidden = v !== 'shop'; $('#cal').hidden = v !== 'cal';
  $('#title').textContent = {todo:'Vores To-do', shop:'Indkøb', cal:'Kalenderaftaler'}[v];
  $('#navTodo').classList.toggle('on', v === 'todo'); $('#navShop').classList.toggle('on', v === 'shop'); $('#navCal').classList.toggle('on', v === 'cal');
  window.scrollTo(0, 0);
}
$('#navTodo').onclick = () => setView('todo');
$('#navShop').onclick = () => setView('shop');
$('#navCal').onclick = () => setView('cal');

/* ---------- Start ---------- */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); setView(view); pull(); checkReminders();
setInterval(() => { pull(); checkReminders(); render(); }, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ pull(); checkReminders(); render(); } });
</script>
</body>
